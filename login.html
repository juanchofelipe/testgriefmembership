<!DOCTYPE html>

<html class="light" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Inicio de Sesión</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#A9C2D4",
            "background-light": "#F5F5F5",
            "background-dark": "#1F2937",
            "text-light": "#333333",
            "text-dark": "#F9FAFB",
            "text-secondary-light": "#888888",
            "text-secondary-dark": "#9CA3AF"
          },
          fontFamily: {
            "display": ["Manrope", "sans-serif"]
          },
          borderRadius: {
            "DEFAULT": "0.5rem",
            "lg": "0.75rem",
            "xl": "1rem",
            "full": "9999px"
          },
        },
      },
    }
  </script>
<style>
    .material-symbols-outlined {
      font-variation-settings:
      'FILL' 0,
      'wght' 400,
      'GRAD' 0,
      'opsz' 24
    }
  </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display">
<script src="main.js"></script>
<div class="relative flex min-h-screen w-full flex-col items-center justify-center group/design-root overflow-x-hidden">
<div class="layout-container flex h-full grow flex-col w-full max-w-md px-4 sm:px-6 lg:px-8">
<div class="flex flex-1 justify-center py-10">
<div class="layout-content-container flex flex-col w-full">
<div class="flex flex-col items-center pb-8">
<div class="w-full flex justify-center pb-4">
<svg class="h-12 w-12 text-primary" fill="currentColor" viewbox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
<path clip-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" fill-rule="evenodd"></path>
</svg>
</div>
<h1 class="text-text-light dark:text-text-dark tracking-tight text-3xl font-bold text-center">Bienvenido de nuevo</h1>
<p class="text-text-secondary-light dark:text-text-secondary-dark text-base font-normal pt-2 text-center">Estamos aquí para ti</p>
</div>
<div class="flex flex-col gap-4">
<label class="flex flex-col w-full">
<p class="text-text-light dark:text-text-dark text-base font-medium pb-2">Correo electrónico</p>
<div class="flex w-full items-stretch rounded-lg">
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-l-lg text-text-light dark:text-text-dark bg-white dark:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-primary h-14 placeholder:text-text-secondary-light dark:placeholder:text-text-secondary-dark p-4 border border-gray-300 dark:border-gray-600 border-r-0 text-base" placeholder="Ingresa tu correo electrónico" type="email"/>
<div class="flex items-center justify-center rounded-r-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 px-4 text-text-secondary-light dark:text-text-secondary-dark">
<span class="material-symbols-outlined">mail</span>
</div>
</div>
</label>
<label class="flex flex-col w-full">
<p class="text-text-light dark:text-text-dark text-base font-medium pb-2">Contraseña</p>
<div class="flex w-full items-stretch rounded-lg">
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-l-lg text-text-light dark:text-text-dark bg-white dark:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-primary h-14 placeholder:text-text-secondary-light dark:placeholder:text-text-secondary-dark p-4 border border-gray-300 dark:border-gray-600 border-r-0 text-base" placeholder="Ingresa tu contraseña" type="password"/>
<div class="flex items-center justify-center rounded-r-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 px-4 text-text-secondary-light dark:text-text-secondary-dark">
<span class="material-symbols-outlined">lock</span>
</div>
</div>
</label>
</div>
<div class="pt-6">
<button class="w-full h-14 rounded-lg bg-primary text-white font-bold text-lg hover:bg-opacity-90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary dark:focus:ring-offset-background-dark transition-colors">
              Iniciar Sesión
            </button>
</div>
<div class="flex flex-col items-center pt-6 gap-3">
<a class="text-sm text-text-secondary-light dark:text-text-secondary-dark hover:text-primary dark:hover:text-primary transition-colors" href="#">¿Olvidaste tu contraseña?</a>
<a class="text-sm text-text-secondary-light dark:text-text-secondary-dark hover:text-primary dark:hover:text-primary transition-colors" href="#">¿No tienes una cuenta? <span class="font-bold text-primary">Regístrate aquí</span></a>
</div>
</div>
</div>
</div>
</div>
</body></html>
